[package]
name = "carpenter"
version = "0.5.0"
edition = "2021"
description = "Agent-driven CLI that builds Python/Jupyter learning material."
license = "Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "6"
rusqlite = { version = "0.31", features = ["bundled"] }
unicode-normalization = "0.1"
serde_yml = "0.0.13"

[build-dependencies]
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }

[workspace]
members = ["xtask"]
resolver = "2"
