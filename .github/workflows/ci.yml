name: ci

on:
  pull_request:
  push:
    branches: [main, nightly]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # adr/021: `main` is the frozen release branch — the only branch that may
  # merge into it is `nightly`. Fail any other PR targeting main.
  guard:
    name: guard (only nightly merges into main)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: assert head branch is nightly
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "nightly" ]; then
            echo "::error::main only accepts merges from the nightly branch (adr/021); got '$HEAD_REF'"
            exit 1
          fi

  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build (strict gates + doc regen)
        run: cargo xtask build
      - name: test
        run: cargo test --workspace
      - name: doc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace
