name: auto-assign owner

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  assign:
    name: assign PR to meolord29
    runs-on: ubuntu-latest
    steps:
      - name: add assignee
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-assignee meolord29
