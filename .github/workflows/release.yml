name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-edge
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: install musl-tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        run: |
          strip target/${{ matrix.target }}/release/carpenter
          tar -czf carpenter-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release carpenter
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: carpenter-${{ matrix.target }}
          path: carpenter-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum carpenter-*.tar.gz > SHA256SUMS
      - name: roll edge release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete edge --cleanup-tag --yes || true
          gh release create edge dist/carpenter-*.tar.gz dist/SHA256SUMS scripts/install.sh \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "carpenter edge (${GITHUB_SHA::7})" \
            --notes "Rolling build from main.

          Install (Linux x86_64, macOS Apple Silicon):

              curl -LsSf https://github.com/meolord29/Carpenter/releases/download/edge/install.sh | sh"

  # Post-publish smoke (adr/019 testing tier): verify the PUBLISHED edge
  # artifact via the literal user one-liner on a clean runner — proves the
  # tarball/checksum/installer pipeline, not just the repo tests (which run
  # against a local file:// fixture).
  smoke:
    name: smoke (${{ matrix.os }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    env:
      CARPENTER_INSTALL_DIR: ${{ github.workspace }}/carpenter-bin
    steps:
      - name: fake opencode on PATH (deterministic auto-register branch)
        run: |
          mkdir -p "$HOME/stub" && printf '#!/bin/sh\nexit 0\n' > "$HOME/stub/opencode" \
            && chmod +x "$HOME/stub/opencode"
          echo "$HOME/stub" >> "$GITHUB_PATH"
      - name: install via the real user one-liner
        run: |
          curl -LsSf https://github.com/meolord29/Carpenter/releases/download/edge/install.sh | sh
      - name: assert shipped surface
        run: |
          set -eu
          BIN="$CARPENTER_INSTALL_DIR/carpenter"
          test -x "$BIN"
          "$BIN" --version
          "$BIN" howto > howto.md && test -s howto.md
          "$BIN" register --app opencode | grep '"status":"ok"'
          test -f "$HOME/.config/opencode/skills/carpenter/SKILL.md" \
            || test -f "$HOME/Library/Application Support/opencode/skills/carpenter/SKILL.md"
      - name: uninstall reverses the footprint
        run: |
          set -eu
          BIN="$CARPENTER_INSTALL_DIR/carpenter"
          "$BIN" uninstall --bin-dir "$CARPENTER_INSTALL_DIR" | grep '"status":"ok"'
          test ! -e "$BIN"
